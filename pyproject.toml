[project]
name = "nyc-taxi-lakehouse"
version = "0.1.0"
description = "Lakehouse + ELT platform on NYC TLC yellow taxi trips: Parquet lake on GCS, PySpark, BigQuery, dbt, Airflow."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pyspark>=4.0,<4.2",
    "pyarrow>=18",
    "requests>=2.32",
    "google-cloud-bigquery>=3.25",
    "dbt-core>=1.10,<1.12",
    "dbt-bigquery>=1.10,<1.12",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "fsspec>=2024.6",
    "aiohttp>=3.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lakehouse"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
