name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write # required to request the OIDC token GitHub exchanges for a Google token

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Lint and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with: # PySpark needs a JVM, and the Spark tests are most of the suite
          distribution: temurin
          java-version: "17"
      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true
      - run: uv sync --frozen
      - name: Ruff
        run: |
          uv run ruff check src tests scripts orchestration/dags
          uv run ruff format --check src tests scripts
      - name: Unit tests
        run: uv run pytest -q

  dbt:
    name: dbt build on one month
    runs-on: ubuntu-latest
    needs: python # do not spend warehouse quota if the code does not even lint
    env:
      GCP_PROJECT_ID: nyc-taxi-lakehouse-508804
      # A single month keeps every pull request to about a gibibyte scanned.
      CI_MONTH: "2024-12"
      DBT_DATASET: ci_${{ github.event.pull_request.number || github.run_id }}
    steps:
      - uses: actions/checkout@v7
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/741153668396/locations/global/workloadIdentityPools/github/providers/github
          service_account: lakehouse-ci@nyc-taxi-lakehouse-508804.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v3
      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true
      - run: uv sync --frozen
      - name: Create an isolated dataset for this run
        run: |
          bq --location=us-central1 mk --dataset \
            --default_table_expiration 86400 \
            --description "CI run ${{ github.run_id }}" \
            "${GCP_PROJECT_ID}:${DBT_DATASET}"
      - name: dbt build
        # Models, seeds and every data-quality test. A failing test fails the job, which is the
        # point: a broken model or bad data blocks the merge.
        run: |
          uv run dbt build --project-dir dbt --profiles-dir dbt --target ci \
            --vars "{\"min_month\": \"${CI_MONTH}\"}"
      - name: Drop the dataset
        if: always() # including when the build failed
        run: bq rm -r -f -d "${GCP_PROJECT_ID}:${DBT_DATASET}"
