# No secrets live here. dev uses your gcloud Application Default Credentials;
# ci reads a service-account key path from the environment.
nyc_taxi:
  target: dev
  outputs:
    dev:
      type: bigquery
      method: oauth
      project: "{{ env_var('GCP_PROJECT_ID') }}"
      dataset: analytics_dev
      location: us-central1
      threads: 4
      job_execution_timeout_seconds: 600
      # Hard per-query cost cap: BigQuery refuses any query that would bill more. A full-history
      # rebuild of the fact legitimately scans about 58 GiB, so the cap sits above that and
      # still stops a runaway query.
      maximum_bytes_billed: 80000000000
    ci:
      type: bigquery
      # Workload Identity Federation: GitHub proves which repository is running and Google issues
      # a short-lived token, so there is no key file anywhere. oauth here means "use ADC", which
      # the auth action populates.
      method: oauth
      project: "{{ env_var('GCP_PROJECT_ID') }}"
      # One throwaway dataset per run, created and dropped by the workflow.
      dataset: "{{ env_var('DBT_DATASET', 'analytics_ci') }}"
      location: us-central1
      threads: 4
      job_execution_timeout_seconds: 600
      maximum_bytes_billed: 5000000000
